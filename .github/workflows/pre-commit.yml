name: pre-commit checks

on:
  push:
    branches:
      - "master"
      - "[0-9].[0-9]*"
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
  # Nightly full-tree sweep. Per-PR runs only lint changed files, so a change
  # that invalidates an untouched file (e.g. a type change that breaks an
  # importing test) can pass every PR yet leave master red. This catches that.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


jobs:
  pre-commit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["current"]') || fromJSON('["current", "next"]') }}
    env:
      SKIP: type-checking-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up backend
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install helm-docs
        run: |
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: superset-frontend/.nvmrc
          cache: npm
          cache-dependency-path: superset-frontend/package-lock.json

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install frontend dependencies
        working-directory: superset-frontend
        run: npm ci

      - name: Install docs dependencies
        working-directory: docs
        run: yarn install --frozen-lockfile

      - name: Run pre-commit checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECK_SCOPE: ${{ github.event_name == 'schedule' && 'all' || 'changed' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          run_full_check=false
          changed_files=()

          case "${CHECK_SCOPE:-}" in
            all)
              run_full_check=true
              ;;
            changed)
              if [ "${EVENT_NAME:-}" = "pull_request" ]; then
                base_sha="${PR_BASE_SHA:-}"
              else
                base_sha="${PUSH_BEFORE_SHA:-}"
              fi

              if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
                echo "::warning::The comparison base is missing or is a placeholder; falling back to a full repository check."
                run_full_check=true
              elif ! base_commit="$(git rev-parse --verify --quiet "${base_sha}^{commit}")"; then
                echo "::warning::The comparison base '${base_sha}' cannot be resolved; falling back to a full repository check."
                run_full_check=true
              elif ! merge_base="$(git merge-base "$base_commit" HEAD 2>/dev/null)" || [ -z "$merge_base" ]; then
                echo "::warning::A common ancestor for the comparison base could not be determined; falling back to a full repository check."
                run_full_check=true
              else
                changed_file_list="$(mktemp)"
                if ! git diff --name-only --diff-filter=ACMRT "$merge_base" HEAD -- > "$changed_file_list"; then
                  echo "::warning::Changed files could not be determined; falling back to a full repository check."
                  run_full_check=true
                else
                  while IFS= read -r changed_file; do
                    if [ -n "$changed_file" ] && [ -e "$changed_file" ]; then
                      changed_files+=("$changed_file")
                    fi
                  done < "$changed_file_list"
                fi
                rm -f "$changed_file_list"

                if [ "$run_full_check" = "false" ] && [ "${#changed_files[@]}" -eq 0 ]; then
                  echo "No changed files remain between ${merge_base} and HEAD; nothing to check."
                  exit 0
                fi
              fi
              ;;
            *)
              echo "::warning::The check scope '${CHECK_SCOPE:-}' is not recognized; falling back to a full repository check."
              run_full_check=true
              ;;
          esac

          if [ "$run_full_check" = "true" ]; then
            echo "Running full repository pre-commit checks."
            pre-commit run --all-files
            status=$?
          else
            echo "Running pre-commit checks on ${#changed_files[@]} changed file(s):"
            printf '  %s\n' "${changed_files[@]}"
            pre-commit run --files "${changed_files[@]}"
            status=$?
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::pre-commit failed with exit code ${status}."
            if [ "$run_full_check" = "true" ]; then
              echo "Check scope: entire repository."
            else
              echo "Files in the check scope:"
              printf '  %s\n' "${changed_files[@]}"
            fi
            if ! git diff --quiet --; then
              echo "Unstaged changes left in tracked files:"
              git diff --name-only --
            fi
            echo "Fix the reported issues locally. This workflow does not commit or push fixes."
            exit "$status"
          fi

          if ! git diff --quiet --; then
            echo "::error::pre-commit succeeded but left unstaged changes in tracked files."
            echo "Files with unstaged changes:"
            git diff --name-only --
            echo "Review and fix these changes locally. This workflow does not commit or push fixes."
            exit 1
          fi

          echo "pre-commit checks passed with no unstaged changes."
