name: Validate All GitHub Actions

on:
  push:
    branches:
      - "master"
      - "[0-9].[0-9]*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


jobs:
  validate-all-ghas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install action-validator
        run: npm install -g @action-validator/core@0.6.0 @action-validator/cli@0.6.0

      - name: Validate GitHub Actions workflows
        run: ./.github/workflows/github-action-validator.sh

      - name: Run GitHub Actions security check
        uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: true
